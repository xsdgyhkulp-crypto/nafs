<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نفس الموجة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff7e8;--card:#fff;--ink:#2b2140;--mut:#7a6f8f;--pri:#6c3ce9;--acc:#ff9f1c;--ok:#1fa971;--bd:#eadfc8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171126;--card:#241b3b;--ink:#f4eeff;--mut:#a99bc7;--pri:#9a7bff;--acc:#ffb347;--ok:#3ddc97;--bd:#3a2f58}}
:root[data-theme="dark"]{--bg:#171126;--card:#241b3b;--ink:#f4eeff;--mut:#a99bc7;--pri:#9a7bff;--acc:#ffb347;--ok:#3ddc97;--bd:#3a2f58}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Tajawal",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;min-height:100vh}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:2.2rem;margin:.2em 0;text-align:center;color:var(--pri);font-weight:800}
p.sub{text-align:center;color:var(--mut);margin:0 0 18px}
.card{background:var(--card);border:2px solid var(--bd);border-radius:20px;padding:18px;margin-bottom:14px}
button{font:inherit;font-weight:700;border:0;border-radius:14px;padding:12px 18px;background:var(--pri);color:#fff;cursor:pointer;width:100%;font-size:1.05rem}
button.sec{background:transparent;color:var(--pri);border:2px solid var(--pri)}
button.sm{width:auto;padding:8px 14px;font-size:.95rem}
button:disabled{opacity:.45}
input,select{font:inherit;width:100%;padding:12px;border-radius:12px;border:2px solid var(--bd);background:var(--bg);color:var(--ink);font-size:1.05rem}
.row{display:flex;gap:8px;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{background:var(--bg);border:2px solid var(--bd);border-radius:999px;padding:6px 12px;display:flex;gap:8px;align-items:center}
.chip b{cursor:pointer;color:var(--mut)}
.q{font-size:1.5rem;font-weight:800;text-align:center;line-height:1.6;margin:8px 0 14px}
.tag{display:inline-block;background:var(--acc);color:#2b2140;border-radius:999px;padding:3px 12px;font-weight:800;font-size:.85rem}
.center{text-align:center}
.big{font-size:1.3rem;font-weight:800;margin:10px 0}
.grp{border:2px solid var(--bd);border-radius:16px;padding:12px;margin-bottom:10px}
.grp.hit{border-color:var(--ok)}
.ans{font-weight:800;font-size:1.15rem}
.pts{float:left;font-weight:800;color:var(--ok)}
.pts.z{color:var(--mut)}
.lb{display:flex;justify-content:space-between;padding:10px 4px;border-bottom:1px dashed var(--bd);font-weight:700}
.lb:last-child{border:0}
.mut{color:var(--mut);font-size:.9rem}
.bd{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.sl{border:2px solid var(--bd);border-radius:12px;padding:10px;text-align:center;font-weight:800;min-height:54px;display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;background:var(--bg);color:var(--mut)}
.sl.on{background:var(--ok);color:#fff;border-color:var(--ok);animation:pp .4s}
.sl.miss{opacity:.65;color:var(--ink)}
.sl small{background:var(--acc);color:#2b2140;border-radius:8px;padding:1px 7px;font-size:.75rem}
@keyframes pp{0%{transform:scale(.8)}60%{transform:scale(1.1)}100%{transform:scale(1)}}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--pri);color:#fff;padding:8px 16px;border-radius:999px;font-weight:800;z-index:9}
.rx{display:flex;gap:8px;justify-content:center;margin-top:10px}.rx button{width:auto;padding:6px 12px;background:var(--bg);color:var(--ink);border:2px solid var(--bd)}
</style>

<body>
<main id="app"></main>
<script>
const norm=s=>s.toLowerCase().replace(/[\u064B-\u0652\u0640]/g,"").replace(/[أإآ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").replace(/[^\p{L}\p{N}\s]/gu,"").replace(/\s+/g," ").trim().replace(/^ال/,"").replace(/\s+ال/g," ");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=document.getElementById("app");
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const BANK=`شيء تاكله مع الرز؟|دجاج/جاج,لحم/لحمه,سمك,خضار,لبن,سلطة
فاكهة تنفع عصير؟|برتقال,تفاح,مانجو/منجا,ليمون,عنب,فراوله/فراولة
شيء ما تطلع من البيت بدونه؟|جوال,محفظة,مفتاح,ساعة,سماعات/سماعه,نظارة
شيء تشربه الصبح؟|قهوة,شاي,ماء/موية/مي,حليب,عصير,نسكافيه
مدينة تسافر لها؟|دبي,اسطنبول,لندن,القاهرة,باريس,مكة
حيوان أليف؟|قطة/قط/بسه,كلب,عصفور,سمكة/سمك,ارنب,ببغاء
شيء تضيفه على القهوة؟|سكر,حليب,هيل/هال,زعفران,قرفة,كريمة
شيء تلقاه في المطبخ؟|ثلاجة,فرن,قدر/طنجره,ملعقة/معلقه,سكين,صحن
وجبة فطور؟|بيض,فول,جبنة/جبن,عسل,زبادي,خبز
لون سيارة؟|ابيض,اسود,رمادي/رصاصي,فضي,احمر,ازرق
شيء تحطه على البيتزا؟|جبنة/جبن,زيتون,فطر,فلفل,طماطم,بيبروني
شيء تسويه وقت الملل؟|نوم/انام,جوال,اكل,مسلسل/فلم/افلام,العاب/العب,تمشية
رياضة تشوفها في التلفزيون؟|كرة قدم/كوره/قدم,كرة سلة/سله,تنس,سباق,مصارعة,كرة طائرة
وسيلة مواصلات؟|سيارة,طيارة/طائره,قطار,باص/حافله,دراجة,مترو
شيء تلبسه في الشتاء؟|جاكيت,سترة,قفاز/قفازات,شال/وشاح,طاقية/قبعه,جزمة/حذاء
حلى تحبه؟|ايسكريم/ايس كريم,كيك/كعك,شوكولاتة/شوكولا,كنافة,بسبوسة,لقيمات`.trim().split("\n").map(l=>{const[q,a]=l.split("|");return{q,a:a.split(",").map(x=>x.split("/"))}});
const PTS=[40,30,20,15,10,5],SECS=45,TRIES=5;
let AC=null;
const ac=()=>{if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==="suspended")AC.resume();return AC};
document.addEventListener("click",ac);
function tone(f,t,d,ty,v,sl){const c=ac();if(!c)return;const o=c.createOscillator(),g=c.createGain(),n=c.currentTime+t;o.type=ty;o.frequency.setValueAtTime(f,n);if(sl)o.frequency.exponentialRampToValueAtTime(sl,n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(c.destination);o.start(n);o.stop(n+d+.02)}
const SND={win:()=>[523,659,784,1047,1319].forEach((f,i)=>tone(f,i*.07,.22,"triangle",.18)),bad:()=>{tone(220,0,.18,"sawtooth",.13,110);tone(147,.16,.32,"sawtooth",.13,70)},ding:()=>{tone(880,0,.15,"sine",.1);tone(1175,.08,.2,"sine",.08)},soft:()=>tone(300,0,.14,"triangle",.07,220),tick:()=>tone(1000,0,.05,"square",.04),start:()=>[392,523,659].forEach((f,i)=>tone(f,i*.1,.18,"triangle",.12)),end:()=>[784,659,523].forEach((f,i)=>tone(f,i*.12,.25,"sine",.12)),fan:()=>[523,523,523,659,784,659,784,1047].forEach((f,i)=>tone(f,i*.13,.25,"square",.07)),pop:()=>tone(600,0,.12,"sine",.1,900)};
const snd=k=>{try{SND[k]()}catch(e){}};
// ====== الصق إعدادات Firebase هنا ======
const FIREBASE_CONFIG={apiKey:"AIzaSyAFJQZjpFiVzDPCwSTYkuA65dqLv3h7qN4",databaseURL:"https://nasser-bac25-default-rtdb.firebaseio.com",projectId:"nasser-bac25"};
// =======================================
const configured=!Object.values(FIREBASE_CONFIG).some(v=>String(v).includes("PASTE"));
const MAX=20,CH="abcdefghjkmnpqrstuvwxyz23456789",EM=["🦊","🐪","🦅","🐎","🦁","🐼","🐯","🐸","🦄","🐙","🐧","🦉","🐬","🐢","🦋","🐝","🦈","🐨","🦒","🐳"];
let db=null,R=null,base=null,pid=Math.random().toString(36).slice(2,10),P={},view="lobby",code="",nick="",emoji="",isCreator=false,joinedAt=0,notice="",wasHost=false,hostTimer=null,localStart=0,lastRs=-1,lastEv=null,rounds=5,mySeq=0,rxN=0,seenRx={},primed=false,toast="",hintR=-1,hintTxt="",lastPh="";
const G0=()=>({ph:"lobby",r:0,qs:[],tot:{},rounds:5,seq:0,rs:0,bd:{},att:{},sn:{},ev:{n:0}});
let G=G0();
const newCode=()=>{let c="";for(let i=0;i<4;i++)c+=CH[Math.floor(Math.random()*CH.length)];return c};
const players=()=>Object.entries(P).filter(([k,v])=>v&&v.n).map(([k,v])=>({peer:k,presence:v,isMe:k===pid})).sort((a,b)=>(a.presence.t-b.presence.t)||(a.peer<b.peer?-1:1)).slice(0,MAX);
const meP=()=>players().find(p=>p.isMe);
const amHost=()=>{const p=players()[0];return !!p&&p.isMe};
const nameOf=id=>{const p=players().find(x=>x.peer===id);return p?p.presence.e+" "+p.presence.n:null};
const pub=()=>base&&base.child("g").set(G);
const normG=g=>({ph:g.ph,r:g.r||0,qs:g.qs||[],tot:g.tot||{},rounds:g.rounds||5,seq:g.seq||0,rs:g.rs||0,bd:g.bd||{},att:g.att||{},sn:g.sn||{},ev:g.ev||{n:0}});
const tries=id=>G.att[id]??TRIES;
function done(){const pl=players();return Object.keys(G.bd).length>=6||(pl.length>0&&pl.every(p=>tries(p.peer)<=0))}
function startRound(){G.ph="ask";G.bd={};G.att={};G.rs++;G.seq++;pub();armTimer()}
function armTimer(){clearTimeout(hostTimer);hostTimer=setTimeout(endRound,SECS*1000+800)}
function endRound(){if(!amHost()||G.ph!=="ask")return;clearTimeout(hostTimer);hostTimer=null;G.ph="rev";G.seq++;pub()}
function handle(){
 let ch=false;const A=BANK[G.qs[G.r]].a;
 players().forEach(p=>{const s=p.presence.s|0;if(s>(G.sn[p.peer]|0)&&p.presence.rd===G.r){
  G.sn[p.peer]=s;const a=tries(p.peer);if(a<=0)return;
  const k=norm(p.presence.a||""),i=A.findIndex((al,j)=>!G.bd[j]&&al.some(x=>norm(x)===k));
  if(i>=0){G.bd[i]={by:p.peer,pts:PTS[i]};G.tot[p.peer]=(G.tot[p.peer]||0)+PTS[i];G.ev={n:(G.ev.n|0)+1,k:"ok",by:p.peer,i}}
  else{G.att[p.peer]=a-1;G.ev={n:(G.ev.n|0)+1,k:"no",by:p.peer}}
  ch=true}});
 if(ch){if(done())endRound();else{G.seq++;pub()}}
}
function onPeers(){
 const pl=players();
 if(amHost()){
  if(!wasHost){wasHost=true;pub()}
  if(G.ph==="ask"){if(!hostTimer)armTimer();handle()}
 }else wasHost=false;
 if(G.rs!==lastRs){lastRs=G.rs;localStart=Date.now();if(G.ph==="ask"&&primed)snd("start")}
 if(G.ev&&G.ev.n!==lastEv){const e=G.ev;if(primed&&lastEv!==null)snd(e.by===pid?(e.k==="ok"?"win":"bad"):(e.k==="ok"?"ding":"soft"));lastEv=e.n}
 if(G.ph!==lastPh){if(primed){if(G.ph==="rev")snd("end");if(G.ph==="end")snd("fan")}lastPh=G.ph}
 pl.forEach(p=>{const n=p.presence.rs|0;if(n>(seenRx[p.peer]|0)){seenRx[p.peer]=n;if(primed&&!p.isMe){toast=p.presence.e+" "+p.presence.rx+" "+p.presence.n;snd("pop");setTimeout(()=>{toast="";render()},2500)}}});
 primed=true;render();
}
async function enter(c,create){
 nick=document.getElementById("nm").value.trim();
 if(!nick){notice="اكتب اسمك أول";return render()}
 if(!db){notice="إعدادات Firebase ناقصة في الملف";return render()}
 try{
  if(create){for(let i=0;i<6;i++){const s=await db.ref("rooms/"+c+"/p").get();if(!s.exists())break;c=newCode()}await db.ref("rooms/"+c).remove()}
  code=c;base=db.ref("rooms/"+c);isCreator=create;joinedAt=create?0:Date.now();emoji=EM[Math.floor(Math.random()*EM.length)];primed=false;lastEv=null;
  const me=base.child("p/"+pid);me.onDisconnect().remove();
  await me.set({n:nick.slice(0,14),e:emoji,t:joinedAt,a:"",s:0,rd:-1,rs:0});
  R={presence:p=>{P[pid]={...(P[pid]||{}),...p};return me.update(p)},leave:()=>{base.off();me.remove()}};
  base.on("value",snap=>{const v=snap.val()||{};P=v.p||{};if(v.g&&!amHost())G=normG(v.g);onPeers()});
  view="room";render();
 }catch(e){notice="تعذر الدخول للغرفة";R=null;render()}
}
function leave(){clearTimeout(hostTimer);hostTimer=null;if(R)R.leave();R=null;base=null;P={};wasHost=false;G=G0();lastRs=-1;view="lobby";render()}
function render(){
 const ae=document.activeElement,keep=ae&&ae.id?{id:ae.id,v:ae.value}:null;
 $.innerHTML=(toast?`<div class="toast">${esc(toast)}</div>`:"")+(view==="lobby"?lobby():roomView());
 bind();
 if(keep){const e=document.getElementById(keep.id);if(e){if(e.tagName==="INPUT")e.value=keep.v;e.focus()}}
}
function lobby(){
 return `<h1>🌊 نفس الموجة</h1><p class="sub">خمّن أشهر الإجابات قبل لا يخلص الوقت، وكل إجابة صح تجيب نقاط!</p>
 <div class="card"><div class="big">اسمك</div><input id="nm" maxlength="14" value="${esc(nick)}" placeholder="اكتب اسمك">
 <div style="height:14px"></div><button id="mk">أنشئ غرفة جديدة</button>
 <p class="center mut">أو ادخل غرفة صاحبك</p><div class="row"><input id="cd" maxlength="6" placeholder="كود الغرفة" style="text-transform:uppercase;text-align:center"><button class="sm sec" id="jn" style="width:110px">ادخل</button></div>
 ${notice?`<p class="center" style="color:#e5484d;font-weight:700">${esc(notice)}</p>`:""}</div>
 <p class="mut center">حتى ${MAX} لاعب في الغرفة، وكل واحد يلعب من جواله.</p>`;
}
function slots(rev){
 const A=BANK[G.qs[G.r]].a;
 return `<div class="bd">${A.map((al,i)=>{const b=G.bd[i];return b?`<div class="sl on">${esc(al[0])}<small>${b.pts}</small><span>${esc((nameOf(b.by)||"").split(" ")[0])}</span></div>`:rev?`<div class="sl miss">${esc(al[0])}<small>${PTS[i]}</small></div>`:`<div class="sl">${i+1}</div>`}).join("")}</div>`;
}
function chips(pl){return `<div class="chips" style="justify-content:center">${pl.map(p=>`<span class="chip">${esc(p.presence.e)} ${esc(p.presence.n)}: <b style="cursor:default;color:var(--ink)">${G.tot[p.peer]||0}</b></span>`).join("")}</div>`}
function roomView(){
 const pl=players(),me=meP(),host=amHost();
 if(R&&pl.length&&!me)return `<div class="card center"><div class="big">الغرفة ممتلئة 😅</div><p class="mut">الحد الأقصى ${MAX} لاعب.</p><button id="lv">رجوع</button></div>`;
 const head=`<div class="card center"><span class="mut">كود الغرفة</span><div style="font-size:2.4rem;font-weight:800;letter-spacing:6px;color:var(--pri)">${esc(code.toUpperCase())}</div>
 <div class="mut">${pl.length} / ${MAX} لاعبين</div>${G.ph==="lobby"?`<div class="chips" style="justify-content:center">${pl.map((p,i)=>`<span class="chip">${esc(p.presence.e)} ${esc(p.presence.n)}${i===0?" 👑":""}${p.isMe?" (أنت)":""}</span>`).join("")}</div>`:""}</div>`;
 let body="";
 if(G.ph==="lobby"){
  if(pl.length<2&&!isCreator)body=`<p class="center mut">ما لقيت أحد بهالكود، تأكد منه.</p>`;
  body+=host?`<div class="card"><div class="big">عدد الجولات</div><select id="rd">${[3,5,8,10].map(n=>`<option value="${n}" ${n===rounds?"selected":""}>${n} جولات</option>`).join("")}</select></div>
  <button id="st" ${pl.length<2?"disabled":""}>ابدأ اللعب</button>${pl.length<2?'<p class="center mut">شارك الكود مع أصحابك، أقل شي لاعبين اثنين</p>':""}`:`<p class="center big">بانتظار المضيف يبدأ اللعبة…</p>`;
 }else if(G.ph==="ask"){
  const t=me?tries(me.peer):0;
  body=`<div class="card"><span class="tag">الجولة ${G.r+1} من ${G.rounds}</span> <span class="tag" id="tm" style="background:var(--pri);color:#fff"></span><div class="q">${esc(BANK[G.qs[G.r]].q)}</div>${slots(false)}
  <div class="center big">${"❤️".repeat(t)||"💔"}</div>
  ${t>0?`<div class="row"><input id="a" maxlength="24" placeholder="اكتب جوابك" autocomplete="off"><button class="sm" id="ok" style="width:70px">✓</button></div>
  <div class="row"><button class="sm sec" id="ht" style="width:100%">💡 تلميح</button></div>${hintR===G.r?`<p class="center mut">${esc(hintTxt)}</p>`:""}`:`<p class="center mut">خلصت محاولاتك، انتظر البقية</p>`}
  <div class="rx">${["👏","😂","😮","🔥"].map(e=>`<button data-rx="${e}">${e}</button>`).join("")}</div></div>${chips(pl)}`;
 }else if(G.ph==="rev"){
  body=`<div class="card"><span class="tag">نتيجة الجولة ${G.r+1}</span><div class="q">${esc(BANK[G.qs[G.r]].q)}</div>${slots(true)}</div>${chips(pl)}
  ${host?`<button id="nx">${G.r+1>=G.rounds?"النتيجة النهائية 🏆":"الجولة التالية"}</button>`:'<p class="center mut">بانتظار المضيف…</p>'}`;
 }else{
  const r=pl.map(p=>[p.presence.e+" "+p.presence.n,G.tot[p.peer]||0]).sort((a,b)=>b[1]-a[1]);
  body=`<div class="card center"><div class="big">🏆 الفائز</div><div class="q" style="font-size:2rem;color:var(--pri)">👑 ${esc(r[0]?r[0][0]:"")}</div></div>
  <div class="card">${r.map((x,i)=>`<div class="lb"><span>${i+1}. ${esc(x[0])}</span><span>${x[1]} نقطة</span></div>`).join("")}</div>
  ${host?'<button id="ag">لعبة جديدة</button>':'<p class="center mut">بانتظار المضيف…</p>'}`;
 }
 return head+body+`<div style="height:14px"></div><button class="sec" id="lv">خروج من الغرفة</button>`;
}
function bind(){
 const g=id=>document.getElementById(id);
 if(g("mk"))g("mk").onclick=()=>enter(newCode(),true);
 if(g("jn"))g("jn").onclick=()=>{const c=g("cd").value.trim().toLowerCase().replace(/[^a-z0-9]/g,"");if(!c){notice="اكتب كود الغرفة";return render()}enter(c,false)};
 if(g("rd"))g("rd").onchange=e=>rounds=+e.target.value;
 if(g("st"))g("st").onclick=()=>{G={...G0(),ph:"ask",qs:shuffle(BANK.map((_,i)=>i)).slice(0,rounds),rounds,seq:G.seq+1,rs:G.rs+1,sn:G.sn};pub();armTimer()};
 if(g("ok")){const send=()=>{const v=g("a").value.trim();if(!norm(v))return;mySeq++;R.presence({a:v,s:mySeq,rd:G.r});g("a").value=""};g("ok").onclick=send;g("a").onkeydown=e=>{if(e.key==="Enter")send()}}
 if(g("ht"))g("ht").onclick=()=>{if(hintR===G.r)return;const A=BANK[G.qs[G.r]].a,i=A.findIndex((al,j)=>!G.bd[j]);if(i<0)return;hintR=G.r;hintTxt="الجواب رقم "+(i+1)+" يبدأ بحرف «"+A[i][0][0]+"»";render()};
 $.querySelectorAll("[data-rx]").forEach(b=>b.onclick=()=>{rxN++;snd("pop");R.presence({rx:b.dataset.rx,rs:rxN})});
 if(g("nx"))g("nx").onclick=()=>{if(G.r+1>=G.rounds){G.ph="end";G.seq++;pub()}else{G.r++;startRound()}};
 if(g("ag"))g("ag").onclick=()=>{G={...G0(),seq:G.seq+1,rs:G.rs,sn:G.sn};pub()};
 if(g("lv"))g("lv").onclick=leave;
}
setInterval(()=>{const t=document.getElementById("tm");if(t&&G.ph==="ask"){const s=Math.max(0,SECS-Math.floor((Date.now()-localStart)/1000));t.textContent="⏱ "+s;if(s>0&&s<=5)snd("tick")}},1000);
if(configured){try{firebase.initializeApp(FIREBASE_CONFIG);db=firebase.database()}catch(e){notice="تعذر الاتصال بـ Firebase"}}else notice="لازم تلصق إعدادات Firebase داخل الملف أول";
render();
</script>
