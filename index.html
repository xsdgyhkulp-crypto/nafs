 bc.forEach((y,i)=>{const x=ac[i];
  if(!x){a.appendChild(y.cloneNode(true));return}
  if(x.nodeType!==y.nodeType||x.nodeName!==y.nodeName||(x.nodeType===1&&x.id!==y.id)){a.replaceChild(y.cloneNode(true),x);return}
  if(y.nodeType===3){if(x.nodeValue!==y.nodeValue)x.nodeValue=y.nodeValue;return}
  if(y.nodeType!==1)return;
  [...x.attributes].forEach(at=>{if(!y.hasAttribute(at.name))x.removeAttribute(at.name)});
  [...y.attributes].forEach(at=>{if(x.getAttribute(at.name)!==at.value&&!(x.nodeName==="INPUT"&&at.name==="value"))x.setAttribute(at.name,at.value)});

}

 ${pending?`<button class="sm sec" id="mk" style="display:block;margin:0 auto">أو أنشئ غرفة جديدة</button>`:""}<div class="row" style="${pending?"display:none;":""}align-items:center;justify-content:center;gap:14px"><input id="cd" maxlength="6" inputmode="numeric" placeholder="كود الغرفة" value="${pending}" style="text-align:center;max-width:190px"><button class="dia" id="jn"><span>انضم</span></button></div>
 ${notice?`<p class="center" style="color:#ff6b81;font-weight:700">${esc(notice)}</p>`:""}</div>
 <p class="mut center">حتى ${MAX} لاعب في الغرفة، وكل واحد يلعب من جواله.</p><p class="mut center" style="font-size:.72rem">الإصدار ${VER}</p>`;
}
const mask=x=>[...x].map((c,k)=>k%2===0||c===" "?c:"_").join("");
function slots(rev){
 const A=curQ().a,mine=G.bd[pid]||{};
 return `<div class="bd">${A.map((al,i)=>{const b=mine["k"+i];return b!==undefined?`<div class="sl on"><small>${b}</small>${esc(al[0])}</div>`:rev?`<div class="sl miss"><small>${PTS[i]}</small>${esc(al[0])}</div>`:hintSlots.includes(i)?`<div class="sl hint">${esc(mask(al[0]))}</div>`:`<div class="sl"><span class="nm">${i+1}</span></div>`}).join("")}</div>`;
}
const topIds=()=>{const pl=players(),m=Math.max(0,...pl.map(p=>G.tot[p.peer]||0));const t=m>0?pl.filter(p=>(G.tot[p.peer]||0)===m).map(p=>p.peer):[];return t.length===1?t:[]};
const hue=n=>[...n].reduce((a,c)=>a+c.charCodeAt(0),0)%360;
const circ=(n,c,e)=>parseAv(e)?`<span class="ci ${c||""}" style="background:none">${avs(e)}</span>`:`<span class="ci ${c||""}" style="background:linear-gradient(135deg,hsl(${hue(n)} 75% 60%),hsl(${(hue(n)+50)%360} 70% 40%))">${esc([...n][0]||"")}</span>`;
function av(p,pts,tops){const n=p.presence.n;return `<button class="av" data-pl="${p.peer}">${tops.includes(p.peer)?'<span class="cr">👑</span>':""}${circ(n,"",p.presence.e)}<span class="an">${esc(n)}${p.isMe?" (أنت)":""}</span>${pts?`<span class="pt">${G.tot[p.peer]||0} pt</span>`:""}${p.peer===ldr()?'<span class="ldt">قائد</span>':""}</button>`}
const row=(pl,pts)=>{const t=pts?topIds():[ldr()];return `<div class="pr">${pl.map(p=>av(p,pts,t)).join("")}</div>`};
const hearts=t=>Array.from({length:TRIES},(_,i)=>`<span class="ht ${i<t?"":"off"}">♥</span>`).join("");
function panel(){
 if(!sel||!amHost()||sel===pid)return "";
 const p=players().find(x=>x.peer===sel);if(!p){sel=null;return ""}
 return `<div class="card center"><div class="big">${esc(p.presence.n)}</div><div class="row"><button id="tl">نقل القيادة</button><button class="sec" id="kk" style="color:#ff6b81;border-color:#ff6b81">طرد من الغرفة</button></div><button class="sm sec" id="cl">إغلاق</button></div>`;
}
const ORD=["الأول","الثاني","الثالث","الرابع","الخامس","السادس","السابع","الثامن","التاسع","العاشر"];
function verWarn(){
 const pl=players(),ld=pl.find(p=>p.peer===ldr()),old=pl.filter(p=>p.presence.v!==VER);
 if(!old.length)return "";
 if(amHost())return `<div class="upd">⚠ ${old.map(p=>esc(p.presence.n)).join("، ")}: نسخة اللعبة عنده قديمة. خله يفتح الرابط من جديد (أو يمسح بيانات الموقع) عشان يشتغل معك صح</div>`;
 return ld&&ld.presence.v!==VER?`<div class="upd">⚠ القائد يستخدم نسخة قديمة. اطلب منه يحدّث اللعبة</div>`:"";
}
function roomView(){
 const pl=players(),me=meP(),host=amHost();
 if(R&&!me){const n=Object.values(P).filter(v=>v&&v.n).length;return n>MAX?`<div class="card center"><div class="big">الغرفة ممتلئة</div><p class="mut">الحد الأقصى ${MAX} لاعب.</p><button id="lv">رجوع</button></div>`:`<div class="card center"><div class="sp"></div><p class="mut">جاري الاتصال…</p></div>`}
 const head=`<div class="card center">${shareBlock()}<div class="mut">${pl.length} / ${MAX} لاعبين</div>${G.ph==="lobby"?row(pl,false)+(host&&pl.length>1?'<p class="mut">اضغط على اسم لاعب عشان تنقل له القيادة أو تطرده</p>':"")+'<button class="sm sec" id="avb" style="margin-top:8px">تغيير الشخصية</button>':""}</div>`;
 let body="";
 if(G.ph!=="lobby"&&G.ph!=="ld"&&G.ph!=="end"&&!curQ())body=`<div class="card center"><div class="sp"></div><p class="mut">جاري تحميل السؤال… إذا طولت اضغط تحديث</p><button class="sm sec" id="upd">تحديث اللعبة</button></div>`;
 else if(G.ph==="lobby"){
  if(pl.length<2&&!isCreator)body=`<p class="center mut">ما لقيت أحد بهالكود، تأكد منه.</p>`;
  body+=host?`<div class="card center"><div class="big">${ROUNDS} جولات</div></div><button id="st" ${pl.length<2?"disabled":""}>ابدأ اللعب</button>${pl.length<2?'<p class="center mut">شارك الكود مع أصحابك، أقل شي لاعبين اثنين</p>':""}`:`<p class="center big">بانتظار القائد يبدأ اللعبة…</p>`;
 }else if(G.ph==="ld"){
  body=`<div class="card center"><div class="sp"></div><div class="big">${G.r===0?"جاري تجهيز اللعبة…":"الجولة "+(G.r+1)}</div><div class="q" id="cd3" style="font-size:3rem;color:var(--acc)"></div></div>`;
 }else if(G.ph==="ask"){
  const t=tries(pid),full=found(pid)>=nA(),rem=Math.max(0,SECS-Math.floor((Date.now()-localStart)/1000));
  body=`<div class="top"><div class="tl"><span class="lb2">الوقت</span><span class="bar"><i id="tmb" style="width:${rem/SECS*100}%"></i></span><b id="tm">${rem}</b></div><div class="tl"><span class="lb2">المحاولات</span><span class="hts">${hearts(t)}</span></div></div>
  <div class="qbox"><span class="rd">الجولة ${G.r+1} / ${G.rounds}</span>${esc(curQ().q)}</div>${full?`<p class="center big">جبت كل الإجابات 🎉<br><span class="mut" style="font-size:.9rem">انتظر لين يخلص السؤال</span></p>`:t>0?`<div class="row"><input id="a" maxlength="24" placeholder="اكتب جوابك" autocomplete="off" enterkeyhint="send"><button class="sm" id="ok" style="width:70px">✓</button></div>`:`<p class="center mut">خلصت محاولاتك، انتظر البقية</p>`}
  ${slots(false)}
  ${!full&&t>0?`<div class="row"><button class="sm sec" id="ht" style="width:100%" ${hintsLeft<=0||hintSlots.length>0?"disabled":""}>تلميح (${hintsLeft})</button></div>`:""}
  ${row(pl,true)}`;
 }else if(G.ph==="rev"){
  body=`<div class="qbox"><span class="rd">نتيجة الجولة ${G.r+1}</span>${esc(curQ().q)}</div>${slots(true)}${row(pl,true)}<p class="center mut">${G.r+1>=G.rounds?"النتيجة النهائية بعد قليل…":"الجولة الجاية بعد قليل…"}</p>`;
 }else{
  const rk=pl.slice().sort((a,b)=>(G.tot[b.peer]||0)-(G.tot[a.peer]||0)),mr=rk.findIndex(p=>p.isMe)+1,uniq=rk.length<2||(G.tot[rk[0].peer]||0)>(G.tot[rk[1].peer]||0);
  body=`<div class="card center">${me?circ(me.presence.n,"lg",me.presence.e):""}<div class="rk">المركز ${ORD[mr-1]||mr}</div></div>
  <div class="pod">${rk.slice(0,3).map((p,i)=>`<div class="pc ${i===0?"first":""}">${i===0&&uniq?'<span class="cr">👑</span>':""}<span class="bdg">${i+1}</span>${circ(p.presence.n,"",p.presence.e)}<span class="an">${esc(p.presence.n)}</span><span class="pt">${G.tot[p.peer]||0} نقطة</span></div>`).join("")}</div>
  ${rk.length>3?`<div class="card">${rk.slice(3).map((p,i)=>`<div class="lb"><span>${i+4}. ${esc(p.presence.n)}</span><span>${G.tot[p.peer]||0} نقطة</span></div>`).join("")}</div>`:""}
  ${host?'<button id="ag">لعبة جديدة</button>':'<p class="center mut">بانتظار القائد…</p>'}`;
 }
 return verWarn()+(G.ph==="lobby"?head:"")+panel()+body+`<div style="height:14px"></div><button class="sec" id="lv">خروج من الغرفة</button><p class="mut center" style="font-size:.72rem;margin-top:10px">الإصدار ${VER}</p>`;
}
function bind(){
 const g=id=>document.getElementById(id);
 if(g("mk"))g("mk").onclick=()=>enter(newCode(),true);
 if(g("jp"))g("jp").onclick=()=>enter(pending,false);
 if(g("jn"))g("jn").onclick=()=>{const c=dig(g("cd").value);if(!c){notice="اكتب كود الغرفة";return render()}enter(c,false)};
 if(g("st"))g("st").onclick=startGame;
 if(g("ok")){const send=()=>{const v=g("a").value.trim();if(!norm(v))return;mySeq++;R.presence({a:v,s:mySeq,rd:G.r,ts:Date.now()});g("a").value=""};g("ok").onclick=send;g("a").onkeydown=e=>{if(e.key==="Enter")send()}}
 if(g("ht"))g("ht").onclick=()=>{if(hintsLeft<=0||hintSlots.length>0)return;const A=curQ().a,i=A.findIndex((al,j)=>!(G.bd[pid]&&G.bd[pid]["k"+j]!==undefined)&&!hintSlots.includes(j));if(i<0)return;hintSlots.push(i);hintsLeft--;render()};
 $.querySelectorAll("[data-pl]").forEach(b=>b.onclick=()=>{if(amHost()&&b.dataset.pl!==pid){sel=b.dataset.pl;render()}});
 if(g("tl"))g("tl").onclick=()=>{G.ld=sel;sel=null;G.seq++;pub();render()};
 if(g("kk"))g("kk").onclick=()=>{const id=sel;sel=null;base.child("k/"+id).set(true);base.child("p/"+id).remove();render()};
 if(g("cl"))g("cl").onclick=()=>{sel=null;render()};
 if(g("ag"))g("ag").onclick=()=>{G={...G0(),ld:G.ld,used:G.used,seq:G.seq+1,rs:G.rs,sn:G.sn};pub()};
 const openAv=()=>{avD=parseAv(myAv);avOpen=true;avCat="h";render()};
 if(g("avh"))g("avh").onclick=openAv;
 if(g("avb"))g("avb").onclick=openAv;
 $.querySelectorAll("[data-ac]").forEach(b=>b.onclick=()=>{avCat=b.dataset.ac;render()});
 $.querySelectorAll("[data-ai]").forEach(b=>b.onclick=()=>{const v=+b.dataset.ai;avD[avCat]=v;if(avCat==="g"){avD.h=0;avD.ex=0}render()});
 if(g("avok"))g("avok").onclick=()=>{myAv=serAv(avD);avManual=true;try{localStorage.setItem("avm","1")}catch(e){}try{localStorage.setItem("avc",myAv)}catch(e){}avOpen=false;if(R)R.presence({e:myAv});render()};
 if(g("avno"))g("avno").onclick=()=>{avOpen=false;render()};
 if(g("cpc"))g("cpc").onclick=async()=>note(await copyTxt(code)?"تم نسخ الكود":"تعذر النسخ");
 if(g("inv"))g("inv").onclick=async()=>note(await copyTxt(roomLink())?"تم نسخ رابط الغرفة":"تعذر النسخ");
 if(g("shr"))g("shr").onclick=async()=>{const t="تعال العب معي نفس الموجة! كود الغرفة: "+code;if(navigator.share&&isWeb()&&/Android|iPhone|iPad/i.test(navigator.userAgent)){try{await navigator.share({title:"نفس الموجة",text:t,url:roomLink()});return}catch(e){if(e&&e.name==="AbortError")return}}note(await copyTxt(t+"\n"+roomLink())?"تم نسخ رابط الدعوة":"تعذر النسخ")};
 if(g("nm"))g("nm").oninput=()=>{nick=g("nm").value;const b0=myAv;autoAv();if(myAv!==b0)render()};
 if(g("upd"))g("upd").onclick=forceUpd;
 if(g("upd2"))g("upd2").onclick=forceUpd;
 if(g("lv"))g("lv").onclick=leave;
}
setInterval(()=>{
 const el=Date.now()-localStart;
 if(G.ph==="ask"){const s=Math.max(0,SECS-Math.floor(el/1000)),t=document.getElementById("tm"),b=document.getElementById("tmb");if(t)t.textContent=s;if(b)b.style.width=(s/SECS*100)+"%";if(s>0&&s<=5)snd("tick")}
 const c=document.getElementById("cd3");if(c&&G.ph==="ld")c.textContent=Math.max(1,3-Math.floor(el/1000));
},1000);
try{nick=localStorage.getItem("nick")||""}catch(e){}
if(window.visualViewport)visualViewport.addEventListener("resize",()=>document.body.classList.toggle("kb",visualViewport.height<screen.height*.72));
document.addEventListener("focusin",e=>{if(e.target&&e.target.id==="a")setTimeout(()=>window.scrollTo({top:0}),350)});
if(configured){try{firebase.initializeApp(FIREBASE_CONFIG);db=firebase.database();db.ref(".info/connected").on("value",s=>{if(s.val()&&R&&base){const me=base.child("p/"+pid);me.onDisconnect().remove();me.set(myS)}})}catch(e){notice="تعذر الاتصال بـ Firebase"}}else notice="لازم تلصق إعدادات Firebase داخل الملف أول";
let newVer="";
const forceUpd=()=>location.replace(location.pathname+"?"+(code?"r="+code+"&":"")+"v="+Date.now());
async function checkUpdate(){try{if(!isWeb())return;const r=await fetch(location.pathname+"?_="+Date.now(),{cache:"no-store"}),m=(await r.text()).match(/const VER="([^"]+)"/);
 if(!m||m[1]===VER)return;
 const idle=!avOpen&&(view==="lobby"||(view==="room"&&(G.ph==="lobby"||G.ph==="end")));
 if(idle&&!sessionStorage.getItem("upd"+m[1])){sessionStorage.setItem("upd"+m[1],"1");location.replace(location.pathname+"?"+(code?"r="+code+"&":pending?"r="+pending+"&":"")+"v="+m[1])}
 else{newVer=m[1];render()}}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)checkUpdate()});
setInterval(checkUpdate,120000);
render();
checkUpdate();
try{if(isWeb()&&"serviceWorker" in navigator)navigator.serviceWorker.register("sw.js")}catch(e){}
addEventListener("hashchange",()=>{const c=dig(location.hash);if(c.length>=4&&!R){pending=c;render()}});
if(pending&&nick&&db)setTimeout(()=>{if(!R)enter(pending,false)},500);
</script>
</body>
</html>
