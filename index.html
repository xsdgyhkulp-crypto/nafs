 const g=id=>document.getElementById(id);
 if(g("mk"))g("mk").onclick=()=>enter(newCode(),true);
 if(g("jp"))g("jp").onclick=()=>enter(pending,false);
 if(g("jn"))g("jn").onclick=()=>{const c=dig(g("cd").value);if(!c){notice="اكتب كود الغرفة";return render()}enter(c,false)};
 if(g("st"))g("st").onclick=startGame;
 if(g("ok")){const send=()=>{const v=g("a").value.trim();if(!norm(v))return;mySeq++;R.presence({a:v,s:mySeq,rd:G.r,ts:Date.now()});g("a").value=""};g("ok").onclick=send;g("a").onkeydown=e=>{if(e.key==="Enter")send()}}
 if(g("ht"))g("ht").onclick=()=>{if(hintsLeft<=0||hintSlots.length>0)return;const A=curQ().a,i=A.findIndex((al,j)=>!(G.bd[pid]&&G.bd[pid]["k"+j]!==undefined)&&!hintSlots.includes(j));if(i<0)return;hintSlots.push(i);hintsLeft--;render()};
 $.querySelectorAll("[data-pl]").forEach(b=>b.onclick=()=>{if(amHost()&&b.dataset.pl!==pid){sel=b.dataset.pl;render()}});
 if(g("tl"))g("tl").onclick=()=>{G.ld=sel;sel=null;G.seq++;pub();render()};
 if(g("kk"))g("kk").onclick=()=>{const id=sel;sel=null;base.child("k/"+id).set(true);base.child("p/"+id).remove();render()};
 if(g("cl"))g("cl").onclick=()=>{sel=null;render()};
 if(g("ag"))g("ag").onclick=()=>{G={...G0(),ld:G.ld,used:G.used,seq:G.seq+1,rs:G.rs,sn:G.sn};pub()};
 const openAv=()=>{avD=parseAv(myAv);avOpen=true;avCat="h";render()};
 if(g("avh"))g("avh").onclick=openAv;
 if(g("avb"))g("avb").onclick=openAv;
 $.querySelectorAll("[data-ac]").forEach(b=>b.onclick=()=>{avCat=b.dataset.ac;render()});
 $.querySelectorAll("[data-ai]").forEach(b=>b.onclick=()=>{const v=+b.dataset.ai;avD[avCat]=v;if(avCat==="g"){avD.h=0;avD.ex=0}render()});
 if(g("avok"))g("avok").onclick=()=>{myAv=serAv(avD);try{localStorage.setItem("avc",myAv)}catch(e){}avOpen=false;if(R)R.presence({e:myAv});render()};
 if(g("avno"))g("avno").onclick=()=>{avOpen=false;render()};
 if(g("cpc"))g("cpc").onclick=async()=>note(await copyTxt(code)?"تم نسخ الكود":"تعذر النسخ");
 if(g("inv"))g("inv").onclick=async()=>note(await copyTxt(roomLink())?"تم نسخ رابط الغرفة":"تعذر النسخ");
 if(g("shr"))g("shr").onclick=async()=>{const t="تعال العب معي نفس الموجة! كود الغرفة: "+code;if(navigator.share&&isWeb()&&/Android|iPhone|iPad/i.test(navigator.userAgent)){try{await navigator.share({title:"نفس الموجة",text:t,url:roomLink()});return}catch(e){if(e&&e.name==="AbortError")return}}note(await copyTxt(t+"\n"+roomLink())?"تم نسخ رابط الدعوة":"تعذر النسخ")};
 if(g("upd"))g("upd").onclick=()=>location.replace(location.pathname+"?"+(code?"r="+code+"&":"")+"v="+Date.now());
 if(g("lv"))g("lv").onclick=leave;
}
setInterval(()=>{
 const el=Date.now()-localStart;
 if(G.ph==="ask"){const s=Math.max(0,SECS-Math.floor(el/1000)),t=document.getElementById("tm"),b=document.getElementById("tmb");if(t)t.textContent=s;if(b)b.style.width=(s/SECS*100)+"%";if(s>0&&s<=5)snd("tick")}
 const c=document.getElementById("cd3");if(c&&G.ph==="ld")c.textContent=Math.max(1,3-Math.floor(el/1000));
},1000);
try{nick=localStorage.getItem("nick")||""}catch(e){}
if(window.visualViewport)visualViewport.addEventListener("resize",()=>document.body.classList.toggle("kb",visualViewport.height<screen.height*.72));
document.addEventListener("focusin",e=>{if(e.target&&e.target.id==="a")setTimeout(()=>window.scrollTo({top:0}),350)});
if(configured){try{firebase.initializeApp(FIREBASE_CONFIG);db=firebase.database();db.ref(".info/connected").on("value",s=>{if(s.val()&&R&&base){const me=base.child("p/"+pid);me.onDisconnect().remove();me.set(myS)}})}catch(e){notice="تعذر الاتصال بـ Firebase"}}else notice="لازم تلصق إعدادات Firebase داخل الملف أول";
async function checkUpdate(){try{if(!isWeb())return;const r=await fetch(location.pathname+"?_="+Date.now(),{cache:"no-store"}),m=(await r.text()).match(/const VER="([^"]+)"/);if(m&&m[1]!==VER&&!sessionStorage.getItem("upd"+m[1])){sessionStorage.setItem("upd"+m[1],"1");location.replace(location.pathname+"?"+(pending?"r="+pending+"&":"")+"v="+m[1])}}catch(e){}}
render();
checkUpdate();
addEventListener("hashchange",()=>{const c=dig(location.hash);if(c.length>=4&&!R){pending=c;render()}});
if(pending&&nick&&db)setTimeout(()=>{if(!R)enter(pending,false)},500);
</script>
</body>
</html>
